<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickDiagnosis</title>
    <link
        href="https://fonts.googleapis.com/css?family=Montserrat:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap&subset=cyrillic"
        rel="stylesheet">
    <link href="/css/style.css" type="text/css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/d23624fc6e.js" crossorigin="anonymous"></script>
</head>

<body>
    <header class="header">
        <img class="svg_param" src="../images/icon.png" alt="иконка" title="иконка">
        <h1>QUICK DIAGNOSIS</h1>
        <div></div>
    </header>
    <main class="main" data-main="mainElement">
    <div>
        <h3>Чтобы войти - заполните данные полей:</h3>
        <form class="formforEntry" method="post" action="/main" target="_self" data-form="entry">
            <div class="fields">
                <p>Введите ваш логин:</p>
                <input class="input" type="text" placeholder="Введите ваш логин" name="login" data-input="login">
            </div>
            <div class="fields">
                <p>Введите ваш пароль:</p>
                <input class="input" type="password" placeholder="Введите ваш пароль" name="password" data-input="pass">
            </div>
            <button class="buttonFromTemplate" type="button" data-button="entry">Войти</button>
        </form>

    </div>
    <div>
        <h3>Чтобы зарегистрироваться - нажмите на кнопку:</h3>
        <form class="formforEntry" method="GET" action="/main/auth" target="_self" data-form="toAuth">
            <button class="buttonFromTemplate" type="submit">Зарегистрироваться</button>
        </form>
    </div>
    </main>
    <footer class="footer">
        <h6 class="footer_content">&copy;olegovich</h6>
    </footer>
</body>
<script type="module" src="/js/forEntryAndAuth/dataFromFormEntry.js"></script>
<script type="module" src="/js/forEntryAndAuth/requestsForEntry.js"></script>

</html>
